eyebrow: "News & Talks"
title: "Updates from the Lab"
description: >
  Follow our latest milestones, awards, and invited talks. We share short updates
  as soon as results are ready for the community.
items:
  - title: "Tutorial on AI-Assisted AMS Design at MWSCAS 2026. Thanks to Prof. Vishal Saxena for hosting the session!"
    date: "Aug 11, 2026"
    category: "Conference"
    summary: >
      Prof. Mehdi Saligane delivered a well-received tutorial on AI-assisted
      analog and mixed-signal (AMS) design at MWSCAS 2026 in Cincinnati. Many
      thanks to Prof. Vishal Saxena for hosting the session!
    location: "MWSCAS 2026, Cincinnati, OH, USA"
  - title: "Ruichen Qi presents digest at TMRC 2026"
    date: "Aug 5, 2026"
    category: "Conference"
    summary: >
      Ruichen Qi presented the digest "An AI-Driven Co-Design Framework for CMOS
      and Emerging Memory Devices" at the 37th Magnetic Recording Conference
      (TMRC 2026) at UC San Diego. The presentation was well received by the
      community, sparking great discussions on AI-driven co-design for emerging
      memory devices.
    location: "TMRC 2026, UC San Diego, CA, USA"
    imagesDir: "tmrc-2026-ruichen"
    link:
      label: "Conference"
      href: "https://tmrc2026.ucsd.edu/"
  - title: "Guanchen Tao presents CryoZip at DAC 2026"
    date: "Jul 28, 2026"
    category: "Conference"
    summary: >
      Guanchen Tao presented his work, CryoZip, at the 63rd Design Automation
      Conference (DAC 2026) in Long Beach. Congratulations, Guanchen, on sharing
      the work with the community!
    location: "DAC 2026, Long Beach, CA, USA"
    imagesDir: "dac-2026-cryozip"
    link:
      label: "Paper (arXiv)"
      href: "https://arxiv.org/abs/2606.30805"
  - title: "IEEE SSCS Distinguished Lecture at KAIST: Rethinking Chip Design in the Age of AI. Thanks to Prof. Wanyeong Jung and his students for hosting and for the wonderful discussions on AI for chip
      design!"
    date: "Jul 13, 2026"
    category: "Distinguished Lecture"
    summary: >
      Prof. Mehdi Saligane delivered the IEEE SSCS distinguished lecture
      "Rethinking Chip Design in the Age of AI" at KAIST, exploring how AI is
      reshaping chip design from two complementary directions: using AI to
      automate and improve chip design, and building specialized chips that make
      AI dramatically more efficient. The talk presented Agentic-RL gLayout for
      analog layout generation and a hardware-software co-design stack for
      efficient edge AI inference. Many thanks to Prof. Wanyeong Jung and his
      students for hosting and for the wonderful discussions on AI for chip
      design!
    location: "KAIST, Daejeon, South Korea"
    imagesDir: "kaist-dl-2026"
