      Prof. Mehdi Saligane was invited to speak at Latch-Up 2026, scheduled for May 1–3 at the University of Waterloo. The FOSSi Foundation conference brings the open-source silicon community together to discuss EDA tools, verification, fabrication access, and AI-assisted design.
