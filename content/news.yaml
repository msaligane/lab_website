    title: "Sharing our vision for AI-driven chip design at KAIST"
    date: "Jul 13, 2026"
    category: "Distinguished Lecture"
    summary: >-
      Prof. Mehdi Saligane visited KAIST to give the IEEE SSCS Distinguished Lecture "Rethinking Chip Design in the Age of AI." The lecture covered Agentic-RL gLayout for analog layout generation and hardware-software co-design for efficient edge AI inference. Prof. Wanyeong Jung and his students hosted the visit.
    location: "KAIST, Daejeon, South Korea"
