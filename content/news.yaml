      Prof. Mehdi Saligane co-chaired the SSCS Directions Series workshop "Think & Impact with ICs: From Words to Circuits - Agentic AI, Foundation Models, and Open EDA" and presented the lab’s work on open, automated design flows for efficient AI-centric systems.
