eyebrow: "News & Talks"
title: "Updates from the Lab"
description: >
  Follow our latest milestones, awards, and invited talks. We share short updates
  as soon as results are ready for the community.
items:
  - title: "SSCS PICO Open-Source Chipathon 2026 Announced"
    date: "May 1, 2026"
    category: "Announcement"
    summary: >
      The IEEE Solid-State Circuits Society has announced the 2026 SSCS "PICO"
      Open-Source Chipathon, with sign-ups and kickoff on May 1, 2026 and tapeout
      submissions due September 2026. Teams worldwide design open-source ICs on
      the GF180MCUD PDK across four tracks: foundational building blocks, sensor
      circuits, MOSbius learning chips, and AI/LLM-assisted design. Prof. Mehdi
      Saligane leads the AI/LLM-assisted Circuits track and serves on the
      Tooling and Reference Flow Committee.
    location: "IEEE SSCS"
    link:
      label: "Announcement"
      href: "https://sscs.ieee.org/technical-committees/tc-ose/sscs-pico-design-contest/"
  - title: "Invited Talk at Latch-Up 2026"
    date: "May 1, 2026"
    category: "Invited Talk"
    summary: >
      Prof. Mehdi Saligane is invited to give a talk at Latch-Up 2026
      (May 1-3, 2026), the FOSSi Foundation's weekend conference dedicated
      to advancing free and open-source silicon. The event gathers the
      open-source digital design community for presentations and networking
      on topics spanning open EDA tools, verification frameworks, fabrication
      access, and AI-assisted design workflows.
    location: "Pearl Sullivan Engineering Building, University of Waterloo"
    link:
      label: "Event page"
      href: "https://fossi-foundation.org/latch-up/2026"
  - title: "IEEE SSCS Distinguished Lecture at University of Waterloo: Rethinking Chip Design in the Age of AI"
    date: "Apr 30, 2026"
    category: "Distinguished Lecture"
    summary: >
      The IEEE Solid-State Circuits Society K-W Section and the University of
      Waterloo host Prof. Mehdi Saligane for a distinguished lecture on
      "Rethinking Chip Design in the Age of AI." The talk covers Agentic-RL
      gLayout for automated analog layout generation and a hardware-software
      co-design stack for efficient edge AI inference that minimizes latency
      and power consumption.
    location: "University of Waterloo"
    link:
      label: "Event page"
      href: "https://uwaterloo.ca/electrical-computer-engineering/events/ieee-solid-state-circuits-society-k-w-section-and-uwaterloo-0"
  - title: "IEEE SSCS Directions Series Workshop: Think & Impact with ICs"
    date: "Sept 22, 2025"
    category: "Workshop"
    summary: >
      Prof. Mehdi Saligane co-chaired the SSCS Directions Series workshop
      "Think & Impact with ICs: From Words to Circuits - Agentic AI, Foundation
      Models, and Open EDA" and presented on open, automated design flows for
      efficient AI-centric systems.
    location: "IEEE SSCS Directions Series"
    link:
      label: "Event page"
      href: "https://sscs.ieee.org/event/ieee-solid-state-circuits-directions-series-think-impact-with-ics-from-words-to-circuits-agentic-ai-foundation-models-and-open-eda-workshop/"
  - title: "Prof. Mehdi Saligane - Okada Laboratory Talk"
    date: "Dec 16, 2025"
    category: "Talk"
    summary: >
      Prof. Mehdi Saligane delivered the talk "AI for Chips & Chips for AI" at
      Okada Laboratory, outlining an open and highly automated paradigm for
      AI-enhanced chip design and efficient AI accelerators. The talk highlighted
      open-source EDA workflows and hardware-software co-design to shorten tapeout
      cycles.
    location: "Okada Laboratory, Institute of Science Tokyo"
    link:
      label: "Event page"
      href: "https://www.ssc.p.isct.ac.jp/en/news/2025-12-16-05-48-51/"
  - title: "AI for Chips and Chips for AI Talk at KAUST Future of Semiconductors Forum"
    date: "May 4, 2025"
    category: "Seminar"
    summary: >
      The KAUST Future of Semiconductors Forum highlighted the "AI for Chips &
      Chips for AI" theme, focusing on automation and open infrastructure for
      mixed-signal and AI-accelerator development. A concurrent CEMSE graduate
      seminar deepened the technical discussion with agentic layout automation
      and hardware-software co-design for efficient edge AI.
    location: "KAUST"
    imagesDir: "kaust-seminar"
    link:
      label: "Event page"
      href: "https://cemse.kaust.edu.sa/events/by-type/graduate-seminar/2025/05/04/ai-chips-and-chips-ai"
  - title: "Seminar by Dr. Mehdi Saligane - Integrated Systems Engineering Laboratory"
    date: "Jan 6, 2025"
    category: "Seminar"
    summary: >
      The Integrated Systems Engineering Laboratory at Kyoto University hosted
      Dr. Mehdi Saligane for a seminar titled "What is Possible with Open Design"
      (held Dec 27, 2024). The talk discussed open-source design flows and their
      impact on practical chip development.
    location: "Kyoto University, Integrated Systems Engineering Laboratory"
    link:
      label: "Event page"
      href: "https://vlsi.cce.i.kyoto-u.ac.jp/archives/1168"
