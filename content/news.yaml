  - slug: "mehdi-saligane-receives-2026-darpa-young-faculty-award"
    body: "mehdi-saligane-receives-2026-darpa-young-faculty-award.md"
    title: "I received a 2026 DARPA Young Faculty Award"
    date: "Sep 23, 2026"
    category: "Award"
    summary: >
      I’m happy to share that I received a 2026 DARPA Young Faculty Award for our work on CMOS-Addressable DNA Random Access Memory. Our goal is to bring molecular data storage together with silicon-chip control so we can write, access, modify, and erase information stored in DNA.
    location: "Brown University"
    link:
      label: "Brown Engineering announcement"
      href: "https://engineering.brown.edu/news/2026-09-23/mehdi-saligane-darpa-young-faculty-award"
