    body: "amd-visit-ai-for-chip-design-and-verification.md"
    title: "Welcoming AMD to the lab: AI for chip design and verification"
    date: "Sep 23, 2026"
    category: "Seminar"
    summary: >
      We welcomed Oleg Petlin and Oleg Raikhman from AMD for a seminar and conversations about AI for chip design and verification. Oleg Petlin presented "Digital Design Verification: Foundations and AI," and our students shared their projects and explored possible collaborations. Thank you both for spending time with us!
    location: "Brown University, Providence, RI, USA"
