    body: "simfony-presented-at-esserc-2026.md"
    title: "SIMFONY presented at ESSERC 2026"
    date: "Sep 9, 2026"
    category: "Conference"
    summary: >-
      The SIMFONY paper was presented at ESSERC 2026 in Palma de Mallorca, Spain. The work describes a multiplexed single-inductor health monitoring node combining HBC, SIMO, PPG, and inference with 1.2 µW standby power.
    location: "ESSERC 2026, Palma de Mallorca, Spain"
    link:
      label: "Conference program"
