  - slug: "sscs-pico-open-source-chipathon-2026-announced"
    body: "sscs-pico-open-source-chipathon-2026-announced.md"
    title: "SSCS PICO Open-Source Chipathon 2026 announced"
    date: "May 1, 2026"
    category: "Announcement"
    summary: >-
      The IEEE Solid-State Circuits Society announced the 2026 SSCS "PICO" Open-Source Chipathon, with kickoff on May 1 and tapeout submissions scheduled for September 2026. Teams design open-source ICs on the GF180MCUD PDK across four tracks. Prof. Mehdi Saligane leads the AI/LLM-assisted Circuits track and serves on the Tooling and Reference Flow Committee.
    location: "IEEE SSCS"
    link:
      label: "Announcement"
      href: "https://sscs.ieee.org/technical-committees/tc-ose/sscs-pico-design-contest/"
