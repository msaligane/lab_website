  - slug: "mehdi-saligane-receives-2026-darpa-young-faculty-award"
    body: "mehdi-saligane-receives-2026-darpa-young-faculty-award.md"
    title: "Honored to receive a 2026 DARPA Young Faculty Award!"
    date: "Sep 23, 2026"
    category: "Award"
    summary: >-
      Honored to receive a 2026 DARPA Young Faculty Award! Our project, "CMOS-Addressable DNA Random Access Memory," explores how silicon circuits can control the writing, retrieval, modification, and erasure of information stored in DNA.
    location: "Brown University"
    link:
      label: "Read the Brown Engineering announcement"
      href: "https://engineering.brown.edu/news/2026-09-23/mehdi-saligane-darpa-young-faculty-award"
  - slug: "amd-visit-ai-for-chip-design-and-verification"
    body: "amd-visit-ai-for-chip-design-and-verification.md"
    title: "Welcoming AMD to the lab: conversations on AI for chip design and verification!"
    date: "Sep 23, 2026"
    category: "Seminar"
    summary: >-
      We welcomed Oleg Petlin and Oleg Raikhman from AMD for a seminar and discussions on AI for chip design and verification. Oleg Petlin presented "Digital Design Verification: Foundations and AI," and our students shared their projects and explored possible collaborations.
    location: "Brown University, Providence, RI, USA"
